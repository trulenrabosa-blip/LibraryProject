<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Riverside University Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="forgot_password.css" />
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <span class="auth-stamp">Renewal</span>

    <div class="auth-brand">
      <div class="auth-brand-mark">RL</div>
      <div>
        <div class="auth-brand-name">Riverside Library</div>
        <div class="auth-brand-sub">Catalog · Circulation · Reserves</div>
      </div>
    </div>

    <a href="login.html" class="auth-back">← Back to sign in</a>

    <h1 class="auth-title">Forgot your password?</h1>
    <p class="auth-subtitle">Enter your account email and we'll send a link to reset it.</p>

    <div id="alert-box"></div>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Send reset link</button>
    </form>
  </div>
</div>

<script type="module" src="forgot_password.js"></script>
</body>
</html>
