<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password — Riverside University Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="reset_password.css" />
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <span class="auth-stamp">Renewal</span>

    <div class="auth-brand">
      <div class="auth-brand-mark">RL</div>
      <div>
        <div class="auth-brand-name">Riverside Library</div>
        <div class="auth-brand-sub">Catalog · Circulation · Reserves</div>
      </div>
    </div>

    <h1 class="auth-title">Set a new password</h1>
    <p class="auth-subtitle">Choose a new password for your account.</p>

    <div id="alert-box"></div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required />
        <div class="field-hint">At least 6 characters.</div>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required />
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Update password</button>
    </form>
  </div>
</div>

<script type="module" src="reset_password.js"></script>
</body>
</html>
